[tool.poetry]
name = "fastapi-rag-app"
version = "0.1.0"
description = "Production-style FastAPI application with PostgreSQL, Docker, and GenAI chatbot support."
authors = ["Your Name <you@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
SQLAlchemy = "^2.0"
psycopg2-binary = "^2.9"
python-dotenv = "^1.0"
openai = "^1.0"
pgvector = "^0.2.0"
python-multipart = "^0.0.20"
pypdf = "^5.0.0"
python-docx = "^1.1.2"
PyJWT = "^2.10.1"
pymupdf = "^2.0"
pytesseract = "^0.3.13"
pillow = "^13.0.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.21"
httpx = "^0.27"

[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"
